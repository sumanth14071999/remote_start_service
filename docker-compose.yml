services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: remotestart
      POSTGRES_USER: remotestart
      POSTGRES_PASSWORD: remotestart
    ports:
      - "5433:5432"   # 5433 on the host, in case a local Postgres already uses 5432

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
